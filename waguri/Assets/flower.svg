<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#FFF0FA"/>
      <stop offset="45%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)" transform="translate(50,50)">
    <!-- 5 Petals -->
    <!-- Petal 1 (0 deg) -->
    <path d="M0,0 C-14,-22 -18,-42 0,-46 C18,-42 14,-22 0,0 Z" fill="url(#petalGrad)" opacity="0.95"/>
    <path d="M-2,-44 C0,-40 2,-44 0,-46 Z" fill="#FFF0FA" opacity="0.6"/>
    <!-- Petal 2 (72 deg) -->
    <g transform="rotate(72)">
      <path d="M0,0 C-14,-22 -18,-42 0,-46 C18,-42 14,-22 0,0 Z" fill="url(#petalGrad)" opacity="0.95"/>
    </g>
    <!-- Petal 3 (144 deg) -->
    <g transform="rotate(144)">
      <path d="M0,0 C-14,-22 -18,-42 0,-46 C18,-42 14,-22 0,0 Z" fill="url(#petalGrad)" opacity="0.95"/>
    </g>
    <!-- Petal 4 (216 deg) -->
    <g transform="rotate(216)">
      <path d="M0,0 C-14,-22 -18,-42 0,-46 C18,-42 14,-22 0,0 Z" fill="url(#petalGrad)" opacity="0.95"/>
    </g>
    <!-- Petal 5 (288 deg) -->
    <g transform="rotate(288)">
      <path d="M0,0 C-14,-22 -18,-42 0,-46 C18,-42 14,-22 0,0 Z" fill="url(#petalGrad)" opacity="0.95"/>
    </g>

    <!-- Flower Center -->
    <circle cx="0" cy="0" r="10" fill="url(#centerGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#FEF08A"/>
    <!-- Stamens -->
    <g stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <line x1="0" y1="0" x2="11" y2="-4"/>
      <line x1="0" y1="0" x2="7" y2="10"/>
      <line x1="0" y1="0" x2="-7" y2="10"/>
      <line x1="0" y1="0" x2="-11" y2="-4"/>
    </g>
    <circle cx="0" cy="-12" r="1.5" fill="#EF4444"/>
    <circle cx="11" cy="-4" r="1.5" fill="#EF4444"/>
    <circle cx="7" cy="10" r="1.5" fill="#EF4444"/>
    <circle cx="-7" cy="10" r="1.5" fill="#EF4444"/>
    <circle cx="-11" cy="-4" r="1.5" fill="#EF4444"/>
  </g>
</svg>
